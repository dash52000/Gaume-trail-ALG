name: Build APK

# Chaque push compile l'appli et lance les tests.
# Seul un push sur main publie l'APK dans les Releases.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK et lancer les tests
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      # Bilan des tests unitaires, visible dans les annotations du commit.
      - name: Bilan des tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); skipped += int(r.get('skipped', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
          print(f"::notice title=Tests unitaires::{total} tests, {failed} échec(s), {skipped} ignoré(s)")
          EOF

      # En cas d'échec, remonte les erreurs (compilation et tests) comme annotations lisibles sur le commit.
      - name: Résumer les erreurs
        if: failure()
        run: |
          set +e
          esc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g'; }
          grep -E '^e: ' build.log | head -15 | while IFS= read -r line; do
            echo "::error title=Kotlin::$(printf '%s' "$line" | esc)"
          done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in tc.findall('failure') + tc.findall('error'):
                  msg = (fl.get('message') or fl.text or '').replace('%', '%25').replace('\n', '%0A')[:600]
                  print(f"::error title=Test {tc.get('classname')}.{tc.get('name')}::{msg}")
          EOF
          done
          wrong=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{if(f) exit}' build.log | head -60 | esc)
          if [ -n "$wrong" ]; then echo "::error title=Gradle::$wrong"; fi
          tail -n 40 build.log | esc | { read -r t; echo "::warning title=Fin du log::$t"; }
          exit 0

      - name: Garder les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            app/build/reports/tests
            app/build/test-results
            build.log
          if-no-files-found: ignore

      # Garde le schéma de la base dans le repo pour pouvoir migrer sans perte plus tard.
      - name: Sauver le schéma de la base
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/schemas
            git commit -m "Schéma de la base exporté par le build"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Préparer l'APK
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk gaume-trail-alg.apk

      - name: Publier la Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gaume Trail ALG 1.0.${{ github.run_number }}
          body: |
            Télécharge `gaume-trail-alg.apk` depuis ton téléphone et ouvre-le pour l'installer.
            Commit : ${{ github.sha }}
          files: gaume-trail-alg.apk
          make_latest: true
